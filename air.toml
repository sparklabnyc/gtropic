# Air formatter settings (Plan 01 INFRA-07). Run `air format .` from the
# package root; the format-check workflow and the pre-commit hook use this file.
[format]
line-width = 80
indent-width = 2
indent-style = "space"
line-ending = "auto"
persistent-line-breaks = true
# Recorded httptest2 responses are generated by data-raw/record-http-mocks.R.
exclude = ["tests/testthat/dv/"]
default-exclude = true
