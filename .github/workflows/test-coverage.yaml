# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# (test-coverage), with the edits from Plan 01 INFRA-04 and the hardening from
# Plan 05 SEC-11: read-only token, actions pinned to commit SHAs, no persisted
# credentials, superseded PR runs cancelled. The tests run with the same
# sandboxed user directories and thread limits as R-CMD-check.yaml.
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main]
  pull_request:

name: test-coverage.yaml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # As under R-CMD-check: tests marked skip_on_cran() (local webfakes
      # servers, no internet) run; live Dataverse tests need
      # GTROPIC_LIVE_TESTS and stay skipped.
      NOT_CRAN: true
      OMP_NUM_THREADS: 2
      OMP_THREAD_LIMIT: 2

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          extra-packages: any::covr, any::xml2
          needs: coverage

      # Sandboxed user directories (Plan 06 G3), set only now so that pak's
      # own package cache is not written there.
      - name: Sandbox R user directories
        shell: bash
        run: |
          for d in cache config data; do mkdir -p "$RUNNER_TEMP/r-user/$d"; done
          {
            echo "R_USER_CACHE_DIR=$RUNNER_TEMP/r-user/cache"
            echo "R_USER_CONFIG_DIR=$RUNNER_TEMP/r-user/config"
            echo "R_USER_DATA_DIR=$RUNNER_TEMP/r-user/data"
          } >> "$GITHUB_ENV"

      - name: Test coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          print(cov)
          covr::to_cobertura(cov)
        shell: Rscript {0}

      # Fork pull requests get no CODECOV_TOKEN, so an upload failure only
      # fails the job outside pull requests.
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          fail_ci_if_error: ${{ github.event_name != 'pull_request' }}
          files: ./cobertura.xml
          plugins: noop
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Show testthat output
        if: always()
        run: |
          ## --------------------------------------------------------------------
          find "$RUNNER_TEMP/package" -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package
