home:
  title: Retrieve, filter, and plot G-TROPIC global tropical cyclone exposure data
    at ADM2/daily resolution (1980-present)
  description: |
    A retrieval, filtering, and plotting client for the live "G-TROPIC" dataset containing global tropical cyclone exposure data at ADM2/daily resolution from 1980-present, published weekly on Harvard Dataverse.
reference:
- title: Retrieval
  desc: |
    The cornerstone data retrieval function and its associated helpers accessing query metadata.
  contents:
  - gtropic_data
  - gtropic_manifest
  - print.gtropic_data
  - summary.gtropic_data
  - print.gtropic_manifest
- title: Discovery
  desc: |
    Functions to explore the available administrative units, storms, years and column definitions.
  contents:
  - gtropic_adm2
  - gtropic_storms
  - gtropic_years
  - gtropic_codebook
- title: Cache
  desc: |
    Optional, opt-in storage of downloaded files between R sessions.
  contents:
  - gtropic_cache_dir
  - gtropic_cache_enable
  - gtropic_cache_list
  - gtropic_cache_clear
  - gtropic_cache_prune
- title: Configuration
  desc: |
    Options controlling the server, dataset identifiers, timeouts and the large query download guardrail.
  contents: gtropic_options
articles:
- title: Using gtropic
  navbar: ~
  contents:
  - getting-started
  - filtering
  - linkage
  - versions-and-caching

